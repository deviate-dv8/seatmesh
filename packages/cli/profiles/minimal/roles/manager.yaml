kind: manager
banner:
  - "cold_start=seatmesh --profile .sm agent whoami --validate | coordination; spawn/review minis; PROPOSAL gate"
read_first:
  - path: .sm/mesh.config.yaml
    note: layout + daemon port + seats.root
  - path: docs/ROLE-YAML.md
    note: extend .sm/roles/ with project playbooks
files:
  - docs/ONE-PATH.md
  - docs/COMMS.md
  - docs/DOTDIR.md
  - docs/SURPASS.md
  - packages/daemon/src/mesh-inbox-server.ts
  - .sm/runtime/daemon/CHECKBACK.jsonl
policies:
  - id: manager_throughput
    text: spawn minis for long generate; master stays coordination + PROPOSAL gate
  - id: peer
    cmd: 'seatmesh --profile .sm agent peer <target> "<msg>"'
  - id: minis
    cmd: "seatmesh --profile .sm agent mini list"
