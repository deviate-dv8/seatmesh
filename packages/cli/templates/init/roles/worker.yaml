kind: worker
extends: common
banner:
  - "cold_start=./sm.sh whoami --validate | seat FOCUS + TASKS every turn"
read_first:
  - path: docs/ONE-PATH.md
    note: one command per job
  - path: docs/ROLE-YAML.md
    note: worker guards + seat POV
files:
  - docs/COMMS.md
  - docs/DOTDIR.md
  - .sm/README.md
policies:
  - id: comms
    cmd: ./sm.sh to-master "<ACK|DONE|BLOCKED|PROVED: ...>"
  - id: peer
    cmd: ./sm.sh to-slot <N> "<msg>"
  - id: checkback
    cmd: ./sm.sh checkback start 5m --renew 3m --expect "topic" --here
  - id: chatroom
    text: ./sm.sh room tail at turn start; ./sm.sh room say "CLAIMED:/DONE:/FYI:" machine lines
