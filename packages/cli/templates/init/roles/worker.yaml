kind: worker
extends: common
banner:
  - "cold_start=seatmesh --profile .sm agent whoami --validate | seat FOCUS + TASKS every turn"
read_first:
  - path: docs/ONE-PATH.md
    note: one command per job
  - path: docs/ROLE-YAML.md
    note: worker guards + seat POV
files:
  - docs/COMMS.md
  - docs/DOTDIR.md
  - .sm/README.md
policies:
  - id: comms
    cmd: 'seatmesh --profile .sm agent peer manager "<ACK|DONE|BLOCKED|PROVED: …>"'
  - id: peer
    cmd: 'seatmesh --profile .sm agent to-slot <N> "<msg>"'
  - id: checkback
    cmd: 'seatmesh --profile .sm agent cb start 5m --renew 3m --expect "topic" --here'
  - id: chatroom
    text: 'seatmesh --profile .sm agent room tail at turn start; seatmesh --profile .sm agent room say "CLAIMED:/DONE:/FYI:" machine lines'
