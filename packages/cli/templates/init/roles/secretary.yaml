# LOCKED — refreshed by `seatmesh update`. Edit ../secretary.extend.yaml only.
role_pack: "1.1.0"
locked:
  - banner
  - read_first
  - policies
kind: secretary
banner:
  - "supervise=ON default | manager + manager-2 | ignore stale mini DIGEST"
  - "no_reconfirm=do not ask operator to continue; nudge idle lead from TASKS"
read_first:
  - path: docs/SUPERVISOR-MANAGER2.md
    note: secretary guards + dual-lead supervise
  - path: .sm/roles/_vendor/docs/secretary.md
    note: locked secretary POV (engine)
files:
  - docs/COMMS.md
  - docs/ONE-PATH.md
  - packages/daemon/src/mesh-inbox-server.ts
  - .sm/runtime/daemon/CHECKBACK.jsonl
  - .sm/runtime/minis.json
policies:
  - id: dual_lead_supervise
    text: "Supervise manager AND manager-2. Ignore stale mini DIGEST. Do not arm mesh-watch. Do not ask operator to continue."
  - id: supervise_on
    cmd: "seatmesh --profile .sm agent secretary supervise on 10m"
  - id: must_not
    text: no worker prompt/switch/merge/night; no rubber-stamp product MINI-DONE
  - id: chatroom
    text: Global chat — seatmesh --profile .sm agent room broadcast or room say; poll seatmesh --profile .sm room tail for mesh status
  - id: limit_idle
    cmd: "seatmesh --profile .sm agent limit idle"
