# LOCKED — refreshed by `seatmesh update`. Edit ../manager.extend.yaml only.
role_pack: "1.1.0"
locked:
  - banner
  - read_first
  - policies
kind: manager
extends: common
banner:
  - "cold_start=seatmesh --profile .sm agent whoami --validate | coordination; spawn/review minis; PROPOSAL gate"
read_first:
  - path: .sm/mesh.config.yaml
    note: layout + daemon port + seats.root
  - path: docs/ROLE-YAML.md
    note: extend .sm/roles/ with project playbooks
  - path: .sm/roles/_vendor/docs/manager.md
    note: locked manager POV (engine)
files:
  - docs/ONE-PATH.md
  - docs/COMMS.md
  - docs/DOTDIR.md
  - docs/SURPASS.md
  - packages/daemon/src/mesh-inbox-server.ts
  - .sm/runtime/daemon/CHECKBACK.jsonl
policies:
  - id: manager_throughput
    text: spawn minis for long generate; master stays coordination + PROPOSAL gate
  - id: progress_fyi
    text: "FYI/PROG/DONE/PROVED from workers = observe-only; do not peer-reply next steps unless operator asked or body is a real ask (BLOCKED?)"
  - id: peer
    cmd: 'seatmesh --profile .sm agent peer <target> "<msg>"'
  - id: minis
    cmd: "seatmesh --profile .sm agent mini list"
  - id: limit_idle
    cmd: "seatmesh --profile .sm agent limit idle   # CC-LIMIT banner → idle; CBs stay armed"
