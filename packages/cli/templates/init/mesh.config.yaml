# seatmesh project config — generated by `npx seatmesh init`
# Docs: https://github.com/.../seatmesh/docs/SM-JSON-ENGINE-DRAFT.md
name: {{name}}
workspace: ..   # project root (parent of .sm/)

paths:
  scope: profile

storage:
  backend: sqlite
  sqlite:
    path: runtime/mesh.sqlite

session:
  name: mesh
  workerCount: 4
  miniMax: 4

layout:
  nvim:
    window: nvim
    enabled: false
  base:
    window: base
    columns: [manager, secretary]
    managerStack: [manager]
    cli:
      manager: agent
      secretary: opencode
    coordSync:
      reload: false
      attach: true
  workers:
    window: workers
    grid: 3x2
    slots: 4
    enabled: false
  minis:
    window: minis
    grid: 2x2
    max: 4
    leads: [1]
    enabled: false

providers:
  - cursor-agent
  - claude
  - opencode
  - empty

seats:
  root: {{seatsRoot}}
  templates: [FOCUS, TASKS, REMINDER]
  dirs:
    manager: manager
    secretary: secretary
    worker: "slot-{n}"
    mini: "mini-{n}"

state:
  meshAgentsJson: .sm/mesh-agents.json
  agentsJson: .sm/agents.json
  autoScrapeIntervalMs: 600000

data:
  root: .sm/runtime

roles:
  dir: roles

daemon:
  port: 31670
  portScope: profile
  portBase: 31670
  portRange: 90
  autoStart: true
  watch: true
  pollMs: 4000
  idleSettleSec: 5
  managerPromptPrefix: "[agent-manager]"

ports:
  worker: "30{n}0/30{n}1"

chatRooms:
  root: .sm/chat-rooms
  globalSlug: global
  checkback:
    duration: 5m
    renew: 3m

connectivity:
  enabled: false
  proxyPort: 18887
