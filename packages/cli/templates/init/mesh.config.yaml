# seatmesh project config — generated by `npx seatmesh init`
# Docs: https://github.com/.../seatmesh/docs/SM-JSON-ENGINE-DRAFT.md
name: {{name}}
workspace: ..   # project root (parent of .sm/)

paths:
  scope: profile

storage:
  backend: sqlite
  sqlite:
    path: runtime/mesh.sqlite

session:
  name: mesh
  workerCount: 4
  miniMax: 4

layout:
  nvim:
    window: nvim
    enabled: false
  base:
    window: base
    columns: [manager, secretary]
    managerStack: [manager]
    # Operator types here — daemon holds injects while busy/typing (no mid-keystroke storms).
    humanCoTyped: [manager, secretary]
    cli:
      manager: agent
      secretary: opencode
    coordSync:
      reload: false
      attach: true
  workers:
    window: workers
    grid: 3x2
    slots: 6
    enabled: false
  minis:
    window: minis
    grid: 2x2
    max: 4
    leads: [1]
    enabled: false
  logs:
    window: logs
    index: 9
    enabled: true

providers:
  - cursor-agent
  - claude
  - opencode
  - empty

seats:
  root: {{seatsRoot}}
  templates: [FOCUS, TASKS, REMINDER]
  dirs:
    manager: manager
    secretary: secretary
    worker: "slot-{n}"
    mini: "mini-{n}"

state:
  meshAgentsJson: mesh-agents.json
  agentsJson: mesh-agents.json
  autoScrapeIntervalMs: 60000

data:
  root: runtime

roles:
  dir: roles

daemon:
  port: 31670
  # workspace: unique port per project (base + hash(workspace) % range) so two
  # seatmesh-managed projects never collide on one machine. Set to "profile"
  # only if you deliberately want every project on this profile pinned to the
  # same fixed port.
  portScope: workspace
  portBase: 31670
  portRange: 90
  autoStart: true
  watch: true
  pollMs: 4000
  idleSettleSec: 5
  managerPromptPrefix: "[agent-manager]"

ports:
  worker: "30{n}0/30{n}1"

chatRooms:
  root: chat-rooms
  globalSlug: global
  checkback:
    duration: 5m
    renew: 3m
    maxFires: 3
  thinNotify:
    minInterval: 5m

# Agent TASKS CRUD — seat task / todo (not hand-edit). reportTo = any base column.
todos:
  reportTo: manager
  checkback:
    duration: 20m
    renew: 10m
    min: 20m

# PPA slack: idle this many seconds + open work ⇒ slack.
ppa:
  idleSlackSec: 120

# ACK redirect defaults (ack redirect / peer --redirect-*).
acks:
  redirect:
    ttlMin: 45
    rewriteTo: secretary
    block: "*managers"

# Who gets peer triage when a target fires (if target has no triageTo).
targets:
  triageTo: [manager, secretary]

connectivity:
  enabled: false
  proxyPort: 18887
