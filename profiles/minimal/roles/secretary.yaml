kind: secretary
read_first:
  - path: docs/ROLE-YAML.md
    note: secretary guards + comms mesh
files:
  - docs/COMMS.md
  - docs/ONE-PATH.md
  - packages/daemon/src/mesh-inbox-server.ts
  - .sm/runtime/daemon/CHECKBACK.jsonl
  - .sm/runtime/minis.json
policies:
  - id: mesh_watch
    cmd: ./sm.sh secretary watch on|off|status
  - id: mini_list
    cmd: ./sm.sh mini list
  - id: must_not
    text: no worker prompt/switch/merge/night; no rubber-stamp product MINI-DONE
  - id: chatroom
    text: Global chat — ./sm.sh room broadcast or room say; poll ./sm.sh room tail for mesh status
