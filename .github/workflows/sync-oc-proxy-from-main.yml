# Sync oc-proxy from main — DISABLED
#
# agent-kinds-json migration: CPE lives on main as kind opencode-cpe (extends opencode).
# Do not keep feeding origin/oc-proxy. Delete the remote branch when ready:
#   git push origin --delete oc-proxy
#
# Re-enable only if you intentionally resurrect that branch.
name: Sync oc-proxy from main

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Set to 'revive' to allow a one-shot sync (otherwise no-op)"
        required: true
        default: "no"

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.inputs.force == 'revive' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into oc-proxy
        env:
          BRANCH: oc-proxy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main "$BRANCH" || true

          if ! git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            echo "origin/$BRANCH missing — not recreating (kinds live on main)"
            exit 0
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "oc-proxy already contains origin/main — nothing to do"
            exit 0
          fi

          if git merge origin/main --no-edit; then
            git push origin "$BRANCH"
            echo "synced origin/main → $BRANCH"
          else
            git merge --abort || true
            echo "::error::Merge conflict merging main into $BRANCH — resolve manually"
            exit 1
          fi
